<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Rachael White Services</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Header/nav shared styles (kept local to avoid changing global stylesheet) */
    .header-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 20px;border-bottom:1px solid #e6e6e6}
    .brand{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
    .nav-logo{height:56px;width:auto;margin-right:14px;display:block}
    nav[aria-label="Primary"] ul{list-style:none;margin:0;padding:0;display:flex;gap:14px;align-items:center}
    nav[aria-label="Primary"] li{display:inline}
    nav[aria-label="Primary"] a{text-decoration:none;color:inherit;padding:6px 8px}
    @media (max-width:720px){.nav-logo{height:48px}}
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a class="brand" href="/index.html" aria-label="Rachael White Services home">
        <img src="/pages/images/Rachael%20White%20Servies%20LOGO.png" alt="Rachael White Services logo" class="nav-logo" />
      </a>

      <nav aria-label="Primary">
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/pages/about.html">About</a></li>
          <li><a href="/pages/services.html">Services</a></li>
          <li><a href="/pages/contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Contact</h1>
    <p>We'd love to hear from you. Email us at <a href="mailto:hello@rachaelwhite.services">hello@rachaelwhite.services</a> or use the form below.</p>

    <form action="/contact-submit" method="post">
      <label for="name">Name</label><br>
      <input id="name" name="name" type="text"><br>

      <label for="email">Email</label><br>
      <input id="email" name="email" type="email"><br>

      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="6"></textarea><br>

      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Rachael White Services</p>
  </footer>
</body>
</html>
