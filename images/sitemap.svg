<?xml version="1.0" encoding="UTF-8"?>
<png xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Rachael White Services - Site Mindmap</title>
  <desc id="desc">A simple SVG mindmap showing site structure: Home, Services (Consultation, Service Overview, Packages), About (Team, Mission), Contact (Email, Contact Form, Phone) centered on "Rachael White Services".</desc>
  <!-- background rounded panel -->
  <rect x="6" y="6" width="1188" height="348" rx="40" ry="40" fill="#fff" stroke="#111" stroke-width="3"/>

  <!-- center node -->
  <g id="center">
    <text x="600" y="176" font-family="Segoe UI, Roboto, Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#222">Rachael White Services</text>
  </g>

  <!-- left group (Home -> Services -> items) -->
  <!-- Home branch (purple) -->
  <path d="M430 160 C480 150, 540 150, 590 160" fill="none" stroke="#7b3fe4" stroke-width="6" stroke-linecap="round"/>
  <text x="430" y="148" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#7b3fe4">Home</text>

  <!-- Services branch (red) -->
  <path d="M520 160 C490 160, 460 160, 430 160" fill="none" stroke="#e0452e" stroke-width="6" stroke-linecap="round"/>
  <text x="470" y="178" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#e0452e">Services</text>

  <!-- Services sub-branches -->
  <path d="M400 160 C340 140, 300 120, 220 120" fill="none" stroke="#e0452e" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 170 C340 170, 300 170, 220 170" fill="none" stroke="#e0452e" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 180 C340 200, 300 220, 220 220" fill="none" stroke="#e0452e" stroke-width="4" stroke-linecap="round"/>

  <text x="200" y="118" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Consultation</text>
  <text x="200" y="170" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Service Overview</text>
  <text x="200" y="222" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Packages</text>

  <!-- right group (About, Contact) -->
  <!-- About branch (blue) -->
  <path d="M690 160 C740 140, 780 120, 880 120" fill="none" stroke="#3b6ef0" stroke-width="6" stroke-linecap="round"/>
  <text x="880" y="108" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#3b6ef0">About</text>

  <path d="M860 120 C900 100, 950 90, 980 90" fill="none" stroke="#3b6ef0" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="86" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Team</text>
  <path d="M860 125 C900 120, 940 110, 980 110" fill="none" stroke="#3b6ef0" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="110" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Mission</text>

  <!-- Contact branch (pink) -->
  <path d="M700 170 C760 170, 820 170, 880 170" fill="none" stroke="#c752d9" stroke-width="6" stroke-linecap="round"/>
  <text x="880" y="186" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#c752d9">Contact</text>

  <path d="M860 170 C900 170, 940 170, 980 170" fill="none" stroke="#c752d9" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="166" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Email</text>

  <path d="M860 185 C900 200, 940 210, 980 210" fill="none" stroke="#c752d9" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="206" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Contact Form</text>

  <path d="M860 200 C900 230, 940 245, 980 250" fill="none" stroke="#c752d9" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="248" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#333">Phone</text>

  <!-- subtle baseline line at bottom like image -->
  <line x1="20" y1="332" x2="1180" y2="332" stroke="#222" stroke-width="2" stroke-linecap="round"/>

</png>
