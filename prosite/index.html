<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Bean Café | Home</title>
  <meta name="description" content="Mountain Bean Café in Colorado serves small-batch coffee for locals and summer hikers. Start your subscription today." />
  <meta name="robots" content="index,follow" />
  <style>
    :root {
      --bg: #f7f3ee;
      --text: #2b2118;
      --brand: #6f4e37;
      --brand-dark: #4b3426;
      --light: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header, footer {
      background: #fff;
      padding: 16px 20px;
    }

    .site-wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      margin: 0;
      font-size: 1.4rem;
    }

    nav a {
      text-decoration: none;
      color: var(--brand-dark);
      margin-right: 14px;
      font-weight: 600;
    }

    nav a:last-child { margin-right: 0; }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    .hero {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 48px 20px;
      color: var(--light);
      background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Mountain%20cafe%20.png");
      background-size: cover;
      background-position: center;
    }

    .hero-content {
      max-width: 760px;
    }

    .hero h2 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      margin: 0 0 10px;
    }

    .hero p {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      margin: 0 0 24px;
    }

    .cta-button {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 8px;
    }

    .cta-button:hover,
    .cta-button:focus {
      background: var(--brand-dark);
    }

    footer p {
      margin: 0;
      text-align: center;
      color: #5a4a3f;
    }
  </style>
  <link rel="stylesheet" href="main.css">
  <link rel="preload" href="fonts/MySiteFont.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <header>
    <div class="site-wrap topbar">
      <h1 class="logo">Mountain Bean Café</h1>
      <nav aria-label="Global navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="subscription.html">Subscription</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <h2 id="hero-title">Fresh Roasted Coffee for Every Mountain Morning</h2>
        <p>From summer travelers to local regulars, we brew small-batch Colorado coffee that keeps adventures going.</p>
        <a class="cta-button" href="subscription.html">Start Your Subscription</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="site-wrap">
      <p>&copy; 2026 Mountain Bean Café. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
