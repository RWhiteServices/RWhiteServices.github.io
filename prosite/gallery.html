<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Bean Café | Gallery</title>
  <meta name="description" content="Browse photos of Mountain Bean Café drinks, pastries, and cozy café moments." />
  <meta name="robots" content="index,follow" />
  <style>
    :root {
      --bg: #f7f3ee;
      --text: #2b2118;
      --brand-dark: #4b3426;
      --card: #ffffff;
      --border: #d8cfc5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header, footer {
      background: #fff;
      padding: 16px 20px;
    }

    .site-wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      margin: 0;
      font-size: 1.4rem;
    }

    nav a {
      text-decoration: none;
      color: var(--brand-dark);
      margin-right: 14px;
      font-weight: 600;
    }

    nav a:last-child { margin-right: 0; }

    nav a:hover,
    nav a:focus { text-decoration: underline; }

    main {
      padding: 28px 20px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 22px;
    }

    h2 {
      margin-top: 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(100px, 1fr));
      gap: 14px;
      justify-items: center;
      margin-top: 16px;
    }

    .gallery-grid a {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      background: #fff;
    }

    .gallery-grid img {
      width: 120px;
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .note {
      font-size: 0.92rem;
      color: #5a4a3f;
      margin-top: 14px;
    }

    footer p {
      margin: 0;
      text-align: center;
      color: #5a4a3f;
    }

    @media (max-width: 500px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="site-wrap topbar">
      <h1 class="logo">Mountain Bean Café</h1>
      <nav aria-label="Global navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="subscription.html">Subscription</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="site-wrap card">
      <h2>Photo Gallery</h2>
      <p>Click any thumbnail to open the image.</p>

      <div class="gallery-grid">
        <a href="thumb1.png">
          <img src="thumb1.png" alt="Sunlit cup of black coffee on a café table near a bright window.">
        </a>
        <a href="thumb2.png">
          <img src="thumb2.png" alt="Barista pouring milk into espresso to create latte art in a white cup.">
        </a>
        <a href="thumb3.png">
          <img src="thumb3.png" alt="Fresh baked muffins displayed on a wooden stand inside the café.">
        </a>
        <a href="thumb4.png">
          <img src="thumb4.png" alt="Roasted coffee beans spilling from a burlap sack onto a wooden surface.">
        </a>
        <a href="thumb5.png">
          <img src="thumb5.png" alt="Three people holding coffee drinks together, including latte art and iced coffee.">
        </a>
        <a href="thumb6.png">
          <img src="thumb6.png" alt="Two iced coffee drinks in clear glasses with coffee beans on the table.">
        </a>
        <a href="thumb7.png">
          <img src="thumb7.png" alt="Barista tamping espresso grounds in a portafilter at the coffee machine.">
        </a>
        <a href="thumb8.png">
          <img src="thumb8.png" alt="Barista preparing a drink at an espresso machine inside the café.">
        </a>
        <a href="thumb9.png">
          <img src="thumb9.png" alt="Coffee and pastries on a café table beside Mountain Bean Café branding.">
        </a>
      </div>

      <p class="note">
        Make sure these files exist in <code>prosite/</code> exactly as:
        <code>thumb1.png</code> to <code>thumb9.png</code>.
      </p>
    </div>
  </main>

  <footer>
    <div class="site-wrap">
      <p>&copy; 2026 Mountain Bean Café. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
